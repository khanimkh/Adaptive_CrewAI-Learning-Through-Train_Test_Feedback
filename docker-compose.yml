services:
  support-train-test-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-train-test-web
    ports:
      - "8010:8010"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
